version: "3.9"

services:
  web:
    build: .
    container_name: ai_task_assistant_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: ai_task_assistant_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_task_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
